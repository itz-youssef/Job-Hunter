name: Cloudflare Secret J Website

on:
  pull_request:
    paths:
      - "cloudflare/site/**"
      - "api/secretj-*.js"
      - "lib/secretj/**"
      - "dist/**"
      - "tests/test_cloudflare_site.cjs"
      - "tests/test_secretj_theme_session.cjs"
      - "tests/test_secretj_member_features.cjs"
      - "package.json"
      - ".github/workflows/cloudflare-site.yml"
  push:
    branches: [main]
    paths:
      - "cloudflare/site/**"
      - "api/secretj-*.js"
      - "lib/secretj/**"
      - "dist/**"
      - "package.json"
      - ".github/workflows/cloudflare-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-secretj-site
  cancel-in-progress: false

jobs:
  verify:
    name: Validate Worker, API and latest static assets
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Neon driver
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run Cloudflare site security and asset tests
        run: |
          node --check cloudflare/site/worker.mjs
          node --check dist/assets/botfolio.js
          node --check dist/assets/botfolio-chat.js
          node --test tests/test_botfolio.cjs
          node --test tests/test_cloudflare_site.cjs tests/test_secretj_theme_session.cjs
          node --test tests/test_secretj_accounts.cjs tests/test_secretj_health.cjs tests/test_neon_schema_contract.cjs tests/test_secretj_member_features.cjs
      - name: Bundle complete Cloudflare website and verify routes
        run: npx --yes wrangler@4 deploy --dry-run --config cloudflare/site/wrangler.toml --outdir /tmp/secretj-site-worker-dry-run

  deploy:
    name: Publish current main UI and backend to Cloudflare
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Install Neon driver
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Include exact published revision in assets
        run: |
          printf '{"git_sha":"%s","source":"github-main","worker":"jobhunter-youssef"}\n' "$GITHUB_SHA" > dist/build-version.json
      - name: Deploy WEBSITE Worker with dist assets (not the scheduler)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config cloudflare/site/wrangler.toml
      - name: Confirm deployed Neon database API responds
        run: |
          SITE="https://jobhunter-youssef.yoyoyasso19.workers.dev"
          echo "Checking public health endpoint (no secrets are logged)"
          curl -sS --max-time 25 --retry 2 --retry-delay 2 \
            "$SITE/api/secretj-health" -o /tmp/secretj-neon-health.json \
            -w "Neon health HTTP: %{http_code}\n"
          cat /tmp/secretj-neon-health.json
          echo
          if grep -q '"database":"ready"' /tmp/secretj-neon-health.json; then
            echo "Production Neon connection: READY"
          else
            echo "::warning::Neon is not ready yet; see the sanitized database reason above."
          fi
      - name: Verify deployed revision
        run: |
          SITE="https://jobhunter-youssef.yoyoyasso19.workers.dev"
          sleep 5
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 15 "$SITE/build-version.json" | grep -q "$GITHUB_SHA"; then
              echo "Live website revision verified: $GITHUB_SHA"
              exit 0
            fi
            sleep 6
          done
          echo "::error::Cloudflare website revision could not be verified."
          exit 1
      - name: Audit Cloudflare WWW routing without modifying it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'DNS and response routing indicators (no credentials):'
          (dig +short CNAME www.jobsnow.tech || true) | head -5
          (curl -sSI --max-time 15 https://www.jobsnow.tech/ | grep -iE '^(HTTP/|server:|cf-ray:|location:|x-powered-by:)' || true)
          echo 'Cloudflare Worker custom-domain registry (host, worker only):'
          curl -fsS --max-time 15 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
            -o /tmp/sj-domains.json || true
          if [ -s /tmp/sj-domains.json ]; then
            node -e 'let d=require("/tmp/sj-domains.json"); console.log("api_success:",d.success); for(let x of (d.result||[])) if(/jobsnow\\.tech$/i.test(x.hostname||"")) console.log("host:",x.hostname,"service:",x.service,"env:",x.environment,"zone:",x.zone_name||"")'
          fi
          echo 'Cloudflare jobsnow.tech zone/worker-route mapping (host, worker only):'
          curl -fsS --max-time 15 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=jobsnow.tech" \
            -o /tmp/sj-zones.json || true
          if [ -s /tmp/sj-zones.json ]; then
            node -e 'let d=require("/tmp/sj-zones.json"); console.log("zone_api_success:",d.success,"zones:",(d.result||[]).map(x=>x.name).join(","))'
            ZONE_ID=$(node -e 'let d=require("/tmp/sj-zones.json");let z=(d.result||[]).find(x=>x.name==="jobsnow.tech");process.stdout.write(z?.id||"")')
            if [ -n "$ZONE_ID" ]; then
              curl -fsS --max-time 15 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" \
                -o /tmp/sj-routes.json || true
              if [ -s /tmp/sj-routes.json ]; then
                node -e 'let d=require("/tmp/sj-routes.json"); console.log("route_api_success:",d.success);for(let x of (d.result||[])) console.log("pattern:",x.pattern,"worker:",x.script||"(none)")'
              fi
            fi
          fi
      - name: Diagnose production WWW route and LinkedIn callback (no OAuth credentials)
        shell: bash
        run: |
          set -euo pipefail
          for SITE in "https://www.jobsnow.tech" "https://jobhunter-youssef.yoyoyasso19.workers.dev"; do
            echo "Checking host: $SITE"
            status=$(curl -sS --max-time 20 -o /tmp/sj-site-build.json -w '%{http_code}' "$SITE/build-version.json" || true)
            echo "build-version HTTP: $status"
            if [[ "$status" == "200" ]]; then
              node -e 'let d=require("/tmp/sj-site-build.json"); console.log("revision:",String(d.git_sha||"unknown").slice(0,12),"source:",d.source,"worker:",d.worker)'
            fi
            # Deliberately omit OAuth code/state. A healthy configured callback
            # rejects this invalid request with reason=response. No database writes.
            curl -sS --max-time 20 -o /dev/null -D /tmp/sj-linkedin-headers.txt \
              "$SITE/api/secretj-linkedin?action=callback" || true
            awk 'BEGIN{IGNORECASE=1} /^HTTP\//{print "callback " $0} /^[Ll]ocation:/{
              if($0 ~ /reason=(response|session|provider|state|exchange|storage)/) {
                if($0 ~ /reason=response/) print "callback setup: CONFIGURED (invalid response rejected)";
                else if($0 ~ /reason=session/) print "callback setup: CONFIG NOT VISIBLE OR SESSION FAILURE";
                else print "callback returned an unexpected phase";
              } else print "callback returned no classified reason"
            }' /tmp/sj-linkedin-headers.txt
          done
