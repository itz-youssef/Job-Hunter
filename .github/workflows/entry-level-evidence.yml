name: Early-career evidence regressions
on:
  pull_request:
    paths:
      - 'app/filters.py'
      - 'app/custom_monitor.py'
      - 'tests/test_entry_level_evidence.py'
      - '.github/workflows/entry-level-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test requirements
        run: python -m pip install pytest requests beautifulsoup4
      - name: Check Python syntax
        run: python -m py_compile app/filters.py app/custom_monitor.py
      - name: Run evidence and public catalog regressions
        run: python -m pytest -q tests/test_entry_level_evidence.py tests/test_public_catalog.py
