name: Breadfast Tech Source Discovery
on:
  pull_request:
    paths:
      - "scripts/probe_breadfast_board.py"
      - ".github/workflows/breadfast-source-ci.yml"
      - "app/breadfast_company_board.py"
      - "app/custom_sources.py"
      - "tests/test_breadfast_company_board.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  examine:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - name: Syntax and Breadfast-specific regression tests
        run: |
          python -m compileall -q app scripts
          python -m pytest -q tests/test_breadfast_company_board.py tests/test_egypt_expansion_feeds.py tests/test_custom_monitor_integration.py
      - name: Live Breadfast Technology smoke test
        run: |
          python - <<'PY'
          from app.custom_sources import scan_company
          jobs,status,reason=scan_company({
              "name":"Breadfast Technology",
              "url":"https://www.breadfast.com/ar/careers_categories/technology/"
          })
          print(status,len(jobs),reason,flush=True)
          for job in jobs:
              print("ROLE",job["title"],job["location"],job["published_at"],flush=True)
          assert status == "partial" and len(jobs)>0
          assert any("Technology Intern" in j["title"] for j in jobs)
          assert all(j["url"].startswith("https://careers.4dxventures.com/companies/breadfast/jobs/") for j in jobs)
          PY
      - name: Inspect public source links
        if: always()
        run: python -m scripts.probe_breadfast_board
