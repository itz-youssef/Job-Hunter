name: Secret J Neon Accounts

on:
  pull_request:
    paths:
      - "lib/secretj/**"
      - "api/secretj-*.js"
      - "database/migrations/**"
      - "dist/account.html"
      - "dist/assets/secretj-account.js"
      - "dist/assets/secretj-job-preferences.js"
      - "tests/test_feed_smart_roles_and_freshness.cjs"
      - "dist/index.html"
      - "dist/assets/secretj-home.js"
      - "dist/assets/secretj-home.css"
      - "tests/test_secretj_public_home.cjs"
      - "tests/test_secretj_theme_session.cjs"
      - "tests/test_secretj_member_features.cjs"
      - "dist/assets/secretj-cv-parser.js"
      - "dist/assets/secretj-avatar-crop.js"
      - "dist/assets/secretj-global-theme.css"
      - "tests/test_secretj_health.cjs"
      - "tests/test_secretj_accounts.cjs"
      - "tests/test_neon_schema_contract.cjs"
      - "package.json"
      - ".github/workflows/secretj-neon-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Neon API, security and frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify browser and server function syntax
        run: |
          node --check lib/secretj/core.js
          node --check api/secretj-auth.js
          node --check tests/test_login_email_otp.cjs
          node --check api/secretj-data.js
          node --check api/secretj-admin.js
          node --check api/secretj-linkedin.js
          node --check api/secretj-health.js
          node --check api/secretj-email.js
          node --check lib/secretj/member-alerts.js
          node --check dist/assets/secretj-cv-parser.js
          node --check dist/assets/secretj-avatar-crop.js
          node --check dist/assets/secretj-home.js
          node --check dist/assets/secretj-account.js
          node --check dist/assets/secretj-job-preferences.js
      - name: Install pinned Neon driver
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify production serverless dependency is installed
        run: node -e "const n=require('@neondatabase/serverless'); if(typeof n.neon!=='function') process.exit(1)"
      - name: Test authentication, owner isolation, admin protections and schema
        run: node --test tests/test_secretj_accounts.cjs tests/test_login_email_otp.cjs tests/test_signup_email_otp.cjs tests/test_neon_schema_contract.cjs tests/test_secretj_public_home.cjs tests/test_secretj_health.cjs tests/test_secretj_theme_session.cjs tests/test_secretj_member_features.cjs tests/test_feed_smart_roles_and_freshness.cjs tests/test_public_to_personalized_feed.cjs

  postgres:
    name: Execute migration on disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: secretj_ci
          POSTGRES_PASSWORD: ci_only_not_a_real_secret
          POSTGRES_DB: secretj_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secretj_ci -d secretj_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: secretj_ci
      PGPASSWORD: ci_only_not_a_real_secret
      PGDATABASE: secretj_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL command-line client if needed
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Apply migration twice to verify idempotency
        run: |
          psql -v ON_ERROR_STOP=1 -f database/migrations/001_secret_j_multitenant.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/001_secret_j_multitenant.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/002_secretj_linkedin_oauth.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/002_secretj_linkedin_oauth.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/003_secretj_member_email.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/003_secretj_member_email.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/010_login_email_verification.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/010_login_email_verification.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/011_signup_email_verification.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/011_signup_email_verification.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/012_professional_profile_details.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/012_professional_profile_details.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/013_botfolio.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/013_botfolio.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/014_botfolio_groq_budget.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/014_botfolio_groq_budget.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/015_botfolio_account_limits.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/015_botfolio_account_limits.sql
      - name: Verify tables, constraints and private access
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE n int;
          BEGIN
            SELECT COUNT(*) INTO n FROM information_schema.tables
              WHERE table_schema='public' AND table_name LIKE 'sj_%';
            IF n <> 19 THEN
              RAISE EXCEPTION 'Expected 19 private Secret J tables, got %', n;
            END IF;
            IF EXISTS (
              SELECT 1 FROM information_schema.role_table_grants
              WHERE table_schema='public'
                AND table_name LIKE 'sj_%'
                AND grantee='PUBLIC'
            ) THEN
              RAISE EXCEPTION 'A Secret J table is accessible to PUBLIC';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='sj_profiles' AND column_name='projects') THEN
              RAISE EXCEPTION 'Expanded profile migration missing';
            END IF;
            IF NOT (
              SELECT relrowsecurity FROM pg_class
              WHERE relname='sj_profiles' AND relnamespace='public'::regnamespace
            ) THEN
              RAISE EXCEPTION 'RLS not enabled on profiles';
            END IF;
          END $$;
          SQL

      - name: Exercise actual Botfolio dual rolling Groq budget SQL
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          PREPARE reserve(text, integer, integer, integer) AS
          INSERT INTO public.sj_botfolio_groq_budget AS budget(id,reservations)
           SELECT 1,jsonb_build_array(jsonb_build_object('id',$1::text,'at',extract(epoch from now()),'tokens',$2::int,'outcome','pending')) WHERE $3::int >= 1 AND $2::int <= $4::int
           ON CONFLICT(id) DO UPDATE SET reservations=(SELECT coalesce(jsonb_agg(e),'[]'::jsonb) FROM jsonb_array_elements(budget.reservations) e WHERE (e->>'at')::double precision>extract(epoch from now())-86400) || EXCLUDED.reservations
           WHERE (SELECT count(*) FROM jsonb_array_elements(budget.reservations) e WHERE (e->>'at')::double precision>extract(epoch from now())-86400) < $3
           AND $2 + (SELECT coalesce(sum((e->>'tokens')::int),0) FROM jsonb_array_elements(budget.reservations) e WHERE (e->>'at')::double precision>extract(epoch from now())-86400) <= $4
           RETURNING id;
          PREPARE settle(text, integer, text, jsonb) AS
          UPDATE public.sj_botfolio_groq_budget SET reservations=(SELECT coalesce(jsonb_agg(CASE WHEN e->>'id'=$1 THEN e || jsonb_build_object('tokens',coalesce($2::int,(e->>'tokens')::int),'reported_tokens',$2::int,'outcome',$3::text,'provider_reset',$4::jsonb) ELSE e END),'[]'::jsonb) FROM jsonb_array_elements(reservations) e) WHERE id=1;
          EXECUTE reserve('first-too-large', 120001, 900, 120000);
          EXECUTE reserve('first', 20000, 900, 120000);
          EXECUTE reserve('token-blocked', 100001, 900, 120000);
          EXECUTE settle('first', 10000, 'success', '{"rpd":{"reset_at":"2026-11-26T12:00:00Z","observed_at":"2026-11-26T00:00:00Z"}}');
          EXECUTE reserve('second', 110000, 900, 120000);
          EXECUTE reserve('full-token-blocked', 1, 900, 120000);
          DO $$ BEGIN
            IF (SELECT jsonb_array_length(reservations) FROM public.sj_botfolio_groq_budget WHERE id=1) <> 2 OR
              (SELECT sum((e->>'tokens')::int) FROM public.sj_botfolio_groq_budget b CROSS JOIN LATERAL jsonb_array_elements(b.reservations) e WHERE id=1) <> 120000 OR
              (SELECT reservations->0->>'reported_tokens' FROM public.sj_botfolio_groq_budget WHERE id=1) <> '10000' THEN
              RAISE EXCEPTION 'Token limit or settlement failed';
            END IF;
          END $$;
          UPDATE public.sj_botfolio_groq_budget SET reservations=(SELECT jsonb_agg(jsonb_build_object('id',i::text,'at',extract(epoch from now()),'tokens',1,'outcome','pending')) FROM generate_series(1,899) i);
          EXECUTE reserve('nine-hundred', 1, 900, 120000);
          EXECUTE reserve('request-blocked', 1, 900, 120000);
          DO $$ BEGIN
            IF (SELECT jsonb_array_length(reservations) FROM public.sj_botfolio_groq_budget WHERE id=1) <> 900 OR
              (SELECT reservations @> '[{"id":"request-blocked"}]'::jsonb FROM public.sj_botfolio_groq_budget WHERE id=1) THEN
              RAISE EXCEPTION '900 request limit failed';
            END IF;
          END $$;
          UPDATE public.sj_botfolio_groq_budget SET reservations=jsonb_set(reservations,'{0,at}',to_jsonb(extract(epoch from now())-86401));
          EXECUTE reserve('released', 1000, 900, 120000);
          DO $$ BEGIN
            IF (SELECT jsonb_array_length(reservations) FROM public.sj_botfolio_groq_budget WHERE id=1) <> 900 OR
              NOT (SELECT reservations @> '[{"id":"released"}]'::jsonb FROM public.sj_botfolio_groq_budget WHERE id=1) THEN
              RAISE EXCEPTION 'Rolling request release failed';
            END IF;
          END $$;
          SQL

      - name: Exercise actual per-model fallback budget SQL
        run: |
          NODE_ENV=test node <<'NODE' > /tmp/botfolio-model-ledger.sql
          const B=require('./lib/secretj/botfolio'),core=require('./lib/secretj/core');
          core.setQueryForTests(async(sql)=>{console.log('PREPARE reserve_model(text,integer,integer,integer,text) AS '+sql+';');return [{id:1}];});
          B.reserveGroq(100,B.FALLBACK_MODEL).catch(e=>{console.error(e);process.exitCode=1;});
          NODE
          cat >> /tmp/botfolio-model-ledger.sql <<'SQL'
          UPDATE public.sj_botfolio_groq_budget SET reservations=jsonb_build_array(jsonb_build_object('id','legacy','at',extract(epoch from now()),'tokens',120000,'outcome','success')) WHERE id=1;
          EXECUTE reserve_model('primary-blocked',1,900,120000,'openai/gpt-oss-120b');
          EXECUTE reserve_model('qwen-allowed',190000,900,190000,'qwen/qwen3.8-27b');
          EXECUTE reserve_model('qwen-blocked',1,900,190000,'qwen/qwen3.8-27b');
          EXECUTE reserve_model('oss20-allowed',190000,900,190000,'openai/gpt-oss-20b');
          EXECUTE reserve_model('oss20-blocked',1,900,190000,'openai/gpt-oss-20b');
          DO $$ BEGIN
            IF (SELECT jsonb_array_length(reservations) FROM public.sj_botfolio_groq_budget WHERE id=1) <> 3 OR NOT (SELECT reservations @> '[{"id":"qwen-allowed","model":"qwen/qwen3.8-27b"},{"id":"oss20-allowed","model":"openai/gpt-oss-20b"}]'::jsonb FROM public.sj_botfolio_groq_budget WHERE id=1) THEN RAISE EXCEPTION 'Per model token isolation failed'; END IF;
          END $$;
          UPDATE public.sj_botfolio_groq_budget SET reservations=jsonb_build_array(jsonb_build_object('id','limited','at',extract(epoch from now()),'tokens',1,'outcome','rate_limited','model','openai/gpt-oss-120b')) WHERE id=1;
          EXECUTE reserve_model('cooldown-blocked',1,900,120000,'openai/gpt-oss-120b');
          EXECUTE reserve_model('fallback-during-cooldown',1,900,190000,'qwen/qwen3.8-27b');
          DO $$ BEGIN
            IF (SELECT jsonb_array_length(reservations) FROM public.sj_botfolio_groq_budget WHERE id=1) <> 2 OR NOT (SELECT reservations @> '[{"id":"fallback-during-cooldown"}]'::jsonb FROM public.sj_botfolio_groq_budget WHERE id=1) THEN RAISE EXCEPTION 'Model cooldown failed'; END IF;
          END $$;
          SQL
          psql -v ON_ERROR_STOP=1 -f /tmp/botfolio-model-ledger.sql

      - name: Verify account quotas with real PostgreSQL
        run: |
          NODE_ENV=test node <<'NODE' > /tmp/botfolio-account-policy.sql
          const core=require('./lib/secretj/core');
          const B=require('./lib/secretj/botfolio');
          let query;
          core.setQueryForTests(async(sql)=>{query=sql;return [{used:1}];});
          (async()=>{await B.consumeOwnerChat('11111111-1111-4111-8111-111111111111',false);console.log('PREPARE owner_chat(uuid, integer) AS '+query+';');})().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
          cat >> /tmp/botfolio-account-policy.sql <<'SQL'
          INSERT INTO public.sj_users(id,email,password_hash,role) VALUES
            ('11111111-1111-4111-8111-111111111111','member@example.invalid',repeat('x',64),'member'),
            ('22222222-2222-4222-8222-222222222222','admin@example.invalid',repeat('x',64),'admin');
          INSERT INTO public.sj_botfolio_bots(id,user_id,slot,name,knowledge,embedding_model)
          VALUES ('33333333-3333-4333-8333-333333333333','11111111-1111-4111-8111-111111111111',1,'Member','[{}]'::jsonb,'test');
          INSERT INTO public.sj_botfolio_bots(id,user_id,slot,name,knowledge,embedding_model)
          SELECT md5('admin-bot-'||s)::uuid,'22222222-2222-4222-8222-222222222222',s,'Admin','[{}]'::jsonb,'test' FROM generate_series(1,6) s;
          INSERT INTO public.sj_botfolio_limits(bucket,day,used) VALUES ('bot:33333333-3333-4333-8333-333333333333',(now() AT TIME ZONE 'UTC')::date,19);
          EXECUTE owner_chat('11111111-1111-4111-8111-111111111111',20);
          EXECUTE owner_chat('11111111-1111-4111-8111-111111111111',20);
          INSERT INTO public.sj_botfolio_limits(bucket,day,used) VALUES ('owner-chat:22222222-2222-4222-8222-222222222222',(now() AT TIME ZONE 'UTC')::date,20);
          EXECUTE owner_chat('22222222-2222-4222-8222-222222222222',NULL);
          DO $$ BEGIN
            IF (SELECT used FROM public.sj_botfolio_limits WHERE bucket='owner-chat:11111111-1111-4111-8111-111111111111') <> 1 THEN RAISE EXCEPTION 'Member quota failed'; END IF;
            IF (SELECT used FROM public.sj_botfolio_limits WHERE bucket='owner-chat:22222222-2222-4222-8222-222222222222') <> 21 THEN RAISE EXCEPTION 'Admin quota exemption failed'; END IF;
            IF (SELECT count(*) FROM public.sj_botfolio_bots WHERE user_id='22222222-2222-4222-8222-222222222222') <> 6 THEN RAISE EXCEPTION 'Admin slot migration failed'; END IF;
          END $$;
          SQL
          psql -v ON_ERROR_STOP=1 -f /tmp/botfolio-account-policy.sql

      - name: Verify actual periodic bulk SQL preserves baseline and email state
        run: |
          psql -v ON_ERROR_STOP=1 -f database/migrations/007_native_preference_monitor.sql
          NODE_ENV=test node <<'NODE' > /tmp/native-watch-batch.sql
          const monitor=require('./lib/secretj/native-preference-monitor'),core=require('./lib/secretj/core');
          core.setQueryForTests(async(sql)=>{console.log('PREPARE reserve_batch(jsonb) AS '+sql+';');return [];});
          monitor.reserveBatch([{}]).catch(e=>{console.error(e);process.exitCode=1;});
          NODE
          cat >> /tmp/native-watch-batch.sql <<'SQL'
          INSERT INTO public.sj_preferences(user_id) VALUES ('11111111-1111-4111-8111-111111111111'),('22222222-2222-4222-8222-222222222222') ON CONFLICT DO NOTHING;
          EXECUTE reserve_batch('[{"user_id":"11111111-1111-4111-8111-111111111111","signature":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","jobs":[{"key":"https://example.invalid/old","job":{"qualification_mode":"dictionary-title-v1","qualification_status":"accepted"}}]},{"user_id":"22222222-2222-4222-8222-222222222222","signature":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","jobs":[]}]');
          EXECUTE reserve_batch('[{"user_id":"11111111-1111-4111-8111-111111111111","signature":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","jobs":[{"key":"https://example.invalid/new","job":{"qualification_mode":"dictionary-title-v1","qualification_status":"accepted"}}]},{"user_id":"22222222-2222-4222-8222-222222222222","signature":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","jobs":[{"key":"https://example.invalid/other","job":{"qualification_mode":"dictionary-title-v1","qualification_status":"accepted"}}]}]');
          UPDATE public.sj_native_watch_jobs SET status='sent',sent_at=now() WHERE job_key='https://example.invalid/new';
          EXECUTE reserve_batch('[{"user_id":"11111111-1111-4111-8111-111111111111","signature":"cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc","jobs":[{"key":"https://example.invalid/new","job":{"qualification_mode":"dictionary-title-v1","qualification_status":"accepted","title":"Updated"}},{"key":"https://example.invalid/rebaseline","job":{"qualification_mode":"dictionary-title-v1","qualification_status":"accepted"}}]},{"user_id":"22222222-2222-4222-8222-222222222222","signature":"dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd","preference_time":"2000-01-01T00:00:00Z","jobs":[{"key":"https://example.invalid/stale","job":{"qualification_mode":"dictionary-title-v1","qualification_status":"accepted"}}]}]');
          DO $$ BEGIN
            IF (SELECT status FROM public.sj_native_watch_jobs WHERE job_key='https://example.invalid/old') IS DISTINCT FROM 'baseline' THEN RAISE EXCEPTION 'Existing jobs were not baselined'; END IF;
            IF (SELECT status FROM public.sj_native_watch_jobs WHERE job_key='https://example.invalid/new') IS DISTINCT FROM 'sent' THEN RAISE EXCEPTION 'Sent job was reset'; END IF;
            IF (SELECT status FROM public.sj_native_watch_jobs WHERE job_key='https://example.invalid/other') IS DISTINCT FROM 'pending' THEN RAISE EXCEPTION 'New job was not queued'; END IF;
            IF (SELECT status FROM public.sj_native_watch_jobs WHERE job_key='https://example.invalid/rebaseline') IS DISTINCT FROM 'baseline' THEN RAISE EXCEPTION 'Changed preference was not baselined'; END IF;
            IF EXISTS(SELECT 1 FROM public.sj_native_watch_jobs WHERE job_key='https://example.invalid/stale') THEN RAISE EXCEPTION 'Stale preference write'; END IF;
            IF (SELECT trim(preference_signature) FROM public.sj_native_watch_state WHERE user_id='22222222-2222-4222-8222-222222222222') IS DISTINCT FROM repeat('b',64) THEN RAISE EXCEPTION 'Stale preference advanced state'; END IF;
          END $$;
          EXECUTE reserve_batch('[{"user_id":"11111111-1111-4111-8111-111111111111","signature":"cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc","jobs":[{"key":"https://example.invalid/noop","job":{"qualification_mode":"dictionary-title-v1","qualification_status":"accepted","qualification_preference_signature":"cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc","source_catalog_stale":false,"title":"Fresh"}}]}]');
          CREATE TEMP TABLE watch_before AS SELECT ctid::text AS tuple_id,job_snapshot,status FROM public.sj_native_watch_jobs WHERE job_key='https://example.invalid/noop';
          EXECUTE reserve_batch('[{"user_id":"11111111-1111-4111-8111-111111111111","signature":"cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc","jobs":[{"key":"https://example.invalid/noop","job":{"qualification_mode":"dictionary-title-v1","qualification_status":"accepted","qualification_preference_signature":"cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc","source_catalog_stale":false,"title":"Fresh"}}]}]');
          EXECUTE reserve_batch('[{"user_id":"11111111-1111-4111-8111-111111111111","signature":"cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc","jobs":[{"key":"https://example.invalid/noop","job":{"qualification_mode":"dictionary-title-v1","qualification_status":"accepted","qualification_preference_signature":"cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc","source_catalog_stale":true,"title":"Discarded stale"}}]}]');
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM public.sj_native_watch_jobs w CROSS JOIN watch_before b WHERE w.job_key='https://example.invalid/noop' AND w.ctid::text=b.tuple_id AND w.job_snapshot=b.job_snapshot AND w.status=b.status) THEN RAISE EXCEPTION 'Identical or discarded stale snapshot rewrote the job tuple'; END IF;
          END $$;
          EXECUTE reserve_batch('[{"user_id":"11111111-1111-4111-8111-111111111111","signature":"cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc","jobs":[{"key":"https://example.invalid/noop","job":{"qualification_mode":"dictionary-title-v1","qualification_status":"accepted","qualification_preference_signature":"cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc","source_catalog_stale":false,"title":"New fresh"}}]}]');
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM public.sj_native_watch_jobs w CROSS JOIN watch_before b WHERE w.job_key='https://example.invalid/noop' AND w.ctid::text<>b.tuple_id AND w.job_snapshot->>'title'='New fresh' AND w.status=b.status) THEN RAISE EXCEPTION 'Actual fresh change was not persisted'; END IF;
          END $$;
          EXECUTE reserve_batch('[{"user_id":"11111111-1111-4111-8111-111111111111","signature":"cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc","jobs":[{"key":"https://example.invalid/shared-packed","job":{"qualification_mode":"dictionary-title-v1","qualification_status":"accepted","qualification_preference_signature":"cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc","source_catalog_stale":false,"title":"Packed snapshot"}}]},{"user_id":"22222222-2222-4222-8222-222222222222","signature":"cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc","preference_time":"2000-01-01T00:00:00Z","jobs_ref":0}]');
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM public.sj_native_watch_jobs WHERE user_id='11111111-1111-4111-8111-111111111111' AND job_key='https://example.invalid/shared-packed') OR EXISTS (SELECT 1 FROM public.sj_native_watch_jobs WHERE user_id='22222222-2222-4222-8222-222222222222' AND job_key='https://example.invalid/shared-packed') THEN RAISE EXCEPTION 'Packed transport bypassed stale preference check'; END IF;
          END $$;
          EXECUTE reserve_batch('[{"user_id":"11111111-1111-4111-8111-111111111111","signature":"cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc","jobs":[{"key":"https://example.invalid/shared-packed","job":{"qualification_mode":"dictionary-title-v1","qualification_status":"accepted","qualification_preference_signature":"cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc","source_catalog_stale":false,"title":"Packed snapshot"}}]},{"user_id":"22222222-2222-4222-8222-222222222222","signature":"cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc","jobs_ref":0}]');
          DO $$ BEGIN
            IF (SELECT count(*) FROM public.sj_native_watch_jobs WHERE job_key='https://example.invalid/shared-packed' AND job_snapshot->>'title'='Packed snapshot')<>2 THEN RAISE EXCEPTION 'Packed reference did not reconstruct both snapshots'; END IF;
            IF (SELECT status FROM public.sj_native_watch_jobs WHERE user_id='11111111-1111-4111-8111-111111111111' AND job_key='https://example.invalid/shared-packed') IS DISTINCT FROM 'pending' OR (SELECT status FROM public.sj_native_watch_jobs WHERE user_id='22222222-2222-4222-8222-222222222222' AND job_key='https://example.invalid/shared-packed') IS DISTINCT FROM 'baseline' THEN RAISE EXCEPTION 'Packed transport mixed per-account notification state'; END IF;
          END $$;
          SQL
          psql -v ON_ERROR_STOP=1 -f /tmp/native-watch-batch.sql

      - name: Verify standalone queue selection against actual PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f database/migrations/004_optional_expanded_job_preferences.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/006_career_level_preferences.sql
          NODE_ENV=test node <<'NODE' > /tmp/native-outbox.sql
          const monitor=require('./lib/secretj/native-preference-monitor'),core=require('./lib/secretj/core');
          core.setQueryForTests(async(sql)=>{console.log('CREATE TEMP VIEW queued_subscribers AS '+sql+';');return [];});
          monitor.queuedSubscriptions().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
          cat >> /tmp/native-outbox.sql <<'SQL'
          INSERT INTO public.sj_users(id,email,password_hash,role) SELECT md5('outbox-test-'||i)::uuid,'outbox-'||i||'@example.invalid',repeat('x',64),'member' FROM generate_series(1,22) i;
          INSERT INTO public.sj_preferences(user_id,email_alerts,max_experience_years) SELECT md5('outbox-test-'||i)::uuid,true,0 FROM generate_series(1,22) i;
          INSERT INTO public.sj_email_verifications(user_id,verified_at) SELECT md5('outbox-test-'||i)::uuid,now() FROM generate_series(1,22) i;
          INSERT INTO public.sj_native_watch_state(user_id,preference_signature) SELECT md5('outbox-test-'||i)::uuid,repeat('e',64) FROM generate_series(1,22) i;
          INSERT INTO public.sj_native_watch_jobs(user_id,job_key,job_snapshot,status,discovered_at)
            SELECT md5('outbox-test-'||i)::uuid,'https://example.invalid/outbox-'||i,
              jsonb_build_object('qualification_status','accepted','qualification_preference_signature',repeat('e',64)),
              'pending',now()+i*interval '1 second' FROM generate_series(1,22) i;
          UPDATE public.sj_users SET is_active=false WHERE id=md5('outbox-test-1')::uuid;
          UPDATE public.sj_preferences SET email_alerts=false WHERE user_id=md5('outbox-test-2')::uuid;
          UPDATE public.sj_email_verifications SET recipient_email='different@example.invalid' WHERE user_id=md5('outbox-test-3')::uuid;
          UPDATE public.sj_email_verifications SET verified_at=NULL WHERE user_id=md5('outbox-test-4')::uuid;
          UPDATE public.sj_preferences SET max_experience_years=NULL,role_families='{}',career_levels='{}',egypt_only=false,internships=false WHERE user_id=md5('outbox-test-5')::uuid;
          UPDATE public.sj_native_watch_jobs SET attempted_at=now() WHERE user_id=md5('outbox-test-6')::uuid;
          UPDATE public.sj_native_watch_jobs SET job_snapshot=job_snapshot||'{"source_catalog_stale":true}'::jsonb WHERE user_id=md5('outbox-test-7')::uuid;
          DO $$ BEGIN
            IF (SELECT count(*) FROM queued_subscribers WHERE id IS NOT NULL)<>15 THEN RAISE EXCEPTION 'Standalone queue eligibility or limit mismatch'; END IF;
            IF EXISTS (SELECT 1 FROM queued_subscribers WHERE id IN (SELECT md5('outbox-test-'||i)::uuid FROM generate_series(1,7) i)) THEN RAISE EXCEPTION 'Ineligible subscriber reached delivery'; END IF;
            IF EXISTS (SELECT 1 FROM generate_series(8,22) i WHERE NOT EXISTS (SELECT 1 FROM queued_subscribers WHERE id=md5('outbox-test-'||i)::uuid AND email_eligible AND has_eligible)) THEN RAISE EXCEPTION 'Eligible subscriber omitted'; END IF;
          END $$;
          UPDATE public.sj_native_watch_jobs SET status='sent' WHERE status IN ('pending','failed');
          DO $$ BEGIN
            IF (SELECT count(*) FROM queued_subscribers WHERE id IS NULL AND has_eligible)<>1 THEN RAISE EXCEPTION 'Empty outbox sentinel mismatch'; END IF;
          END $$;
          UPDATE public.sj_preferences SET email_alerts=false;
          DO $$ BEGIN
            IF (SELECT count(*) FROM queued_subscribers WHERE id IS NULL AND NOT has_eligible)<>1 THEN RAISE EXCEPTION 'No eligible subscriber sentinel mismatch'; END IF;
          END $$;
          SQL
          psql -v ON_ERROR_STOP=1 -f /tmp/native-outbox.sql

      - name: Verify immediate watch SQL retains state without unnecessary rewrites
        run: |
          NODE_ENV=test node <<'NODE' > /tmp/immediate-watch.sql
          const monitor=require('./lib/secretj/native-preference-monitor'),core=require('./lib/secretj/core');
          core.setQueryForTests(async(sql)=>{if(sql.includes('INSERT INTO public.sj_native_watch_jobs'))console.log('PREPARE immediate_watch(uuid,jsonb,text,timestamptz) AS '+sql+';');return [];});
          monitor.reserveNew({id:'11111111-1111-4111-8111-111111111111'},'c'.repeat(64),[{title:'Junior Engineer',url:'https://example.invalid/immediate',qualification_status:'accepted'}]).catch(e=>{console.error(e);process.exitCode=1;});
          NODE
          cat >> /tmp/immediate-watch.sql <<'SQL'
          EXECUTE immediate_watch('11111111-1111-4111-8111-111111111111','[{"key":"https://example.invalid/immediate","job":{"title":"Fresh","source_catalog_stale":false,"qualification_mode":"dictionary-title-v1","qualification_status":"accepted","qualification_preference_signature":"cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"}}]','baseline',NULL);
          UPDATE public.sj_native_watch_jobs SET status='sent',sent_at=now() WHERE job_key='https://example.invalid/immediate';
          CREATE TEMP TABLE immediate_before AS SELECT ctid::text AS tuple_id,job_snapshot,status,sent_at FROM public.sj_native_watch_jobs WHERE job_key='https://example.invalid/immediate';
          EXECUTE immediate_watch('11111111-1111-4111-8111-111111111111','[{"key":"https://example.invalid/immediate","job":{"title":"Fresh","source_catalog_stale":false,"qualification_mode":"dictionary-title-v1","qualification_status":"accepted","qualification_preference_signature":"cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"}}]','pending',NULL);
          EXECUTE immediate_watch('11111111-1111-4111-8111-111111111111','[{"key":"https://example.invalid/immediate","job":{"title":"Stale","source_catalog_stale":true,"qualification_mode":"dictionary-title-v1","qualification_status":"accepted","qualification_preference_signature":"cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"}}]','pending',NULL);
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM public.sj_native_watch_jobs w CROSS JOIN immediate_before b WHERE w.job_key='https://example.invalid/immediate' AND w.ctid::text=b.tuple_id AND w.job_snapshot=b.job_snapshot AND w.status=b.status AND w.sent_at=b.sent_at) THEN RAISE EXCEPTION 'Immediate no-op rewrote tuple or changed sent state'; END IF;
          END $$;
          EXECUTE immediate_watch('11111111-1111-4111-8111-111111111111','[{"key":"https://example.invalid/immediate","job":{"title":"Fresh change","source_catalog_stale":false,"qualification_mode":"dictionary-title-v1","qualification_status":"accepted","qualification_preference_signature":"cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"}}]','pending',NULL);
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM public.sj_native_watch_jobs w CROSS JOIN immediate_before b WHERE w.job_key='https://example.invalid/immediate' AND w.ctid::text<>b.tuple_id AND w.job_snapshot->>'title'='Fresh change' AND w.status='sent' AND w.sent_at=b.sent_at) THEN RAISE EXCEPTION 'Immediate fresh change not retained or sent state lost'; END IF;
          END $$;
          SQL
          psql -v ON_ERROR_STOP=1 -f /tmp/immediate-watch.sql

      - name: Verify durable isolated synchronization with actual PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f database/migrations/016_secretj_isolated_sync_outbox.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/016_secretj_isolated_sync_outbox.sql
          psql -v ON_ERROR_STOP=1 -f database/isolated/001_secretj_mirror.sql
          psql -v ON_ERROR_STOP=1 -f database/isolated/001_secretj_mirror.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          INSERT INTO public.sj_native_watch_jobs(user_id,job_key,job_snapshot,status)
          VALUES('11111111-1111-4111-8111-111111111111','https://example.invalid/sync','{"title":"Original","qualification_status":"accepted","qualification_reason":"first","precise":0.1234567890123456789}','baseline');
          CREATE TEMP TABLE original_sync AS
          SELECT q.revision,to_jsonb(w) AS record,encode(sha256(convert_to(to_jsonb(w)::text,'UTF8')),'hex') AS digest
          FROM secretj_migration_sync.outbox q JOIN public.sj_native_watch_jobs w ON w.user_id=q.owner_id AND w.job_key=q.entity_key WHERE q.entity_key='https://example.invalid/sync';
          SELECT secretj_migration_sync.apply_batch('jobHunter',jsonb_build_array(jsonb_build_object(
            'owner_id','11111111-1111-4111-8111-111111111111','entity_key','https://example.invalid/sync',
            'revision',revision::text,'record_text',record::text,'record_digest',digest))) FROM original_sync;
          DO $$ BEGIN
            IF NOT EXISTS(SELECT 1 FROM secretj_migration_sync.reconstructed r CROSS JOIN original_sync o WHERE r.entity_key='https://example.invalid/sync' AND r.full_record=o.record AND r.record_digest=o.digest) THEN RAISE EXCEPTION 'Reconstruction mismatch'; END IF;
          END $$;
          UPDATE public.sj_native_watch_jobs SET status='sent',sent_at=now() WHERE job_key='https://example.invalid/sync';
          DO $$ BEGIN
            IF NOT EXISTS(SELECT 1 FROM secretj_migration_sync.outbox q CROSS JOIN original_sync o WHERE q.entity_key='https://example.invalid/sync' AND q.revision>o.revision) THEN RAISE EXCEPTION 'Update not captured'; END IF;
          END $$;
          DELETE FROM secretj_migration_sync.outbox q USING original_sync o WHERE q.entity_key='https://example.invalid/sync' AND q.revision=o.revision;
          DO $$ BEGIN
            IF NOT EXISTS(SELECT 1 FROM secretj_migration_sync.outbox WHERE entity_key='https://example.invalid/sync') THEN RAISE EXCEPTION 'Old acknowledgement removed new revision'; END IF;
          END $$;
          DELETE FROM public.sj_native_watch_jobs WHERE job_key='https://example.invalid/sync';
          SELECT secretj_migration_sync.apply_batch('jobHunter',jsonb_build_array(jsonb_build_object(
             'owner_id',owner_id,'entity_key',entity_key,'revision',revision::text,'record_text',NULL,'record_digest',NULL)))
          FROM secretj_migration_sync.outbox WHERE entity_key='https://example.invalid/sync';
          SELECT secretj_migration_sync.apply_batch('jobHunter',jsonb_build_array(jsonb_build_object(
            'owner_id','11111111-1111-4111-8111-111111111111','entity_key','https://example.invalid/sync',
            'revision',revision::text,'record_text',record::text,'record_digest',digest))) FROM original_sync;
          DO $$ BEGIN
            IF NOT EXISTS(SELECT 1 FROM secretj_migration_sync.reconstructed WHERE entity_key='https://example.invalid/sync' AND full_record IS NULL AND record_digest IS NULL) THEN RAISE EXCEPTION 'Old retry resurrected deleted job'; END IF;
          END $$;
          ROLLBACK;
          SQL
