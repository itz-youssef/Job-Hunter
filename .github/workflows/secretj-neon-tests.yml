name: Secret J Neon Accounts

on:
  pull_request:
    paths:
      - "lib/secretj/**"
      - "api/secretj-*.js"
      - "database/migrations/**"
      - "dist/account.html"
      - "dist/assets/secretj-account.js"
      - "dist/index.html"
      - "tests/test_secretj_accounts.cjs"
      - "tests/test_neon_schema_contract.cjs"
      - "package.json"
      - ".github/workflows/secretj-neon-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Neon API, security and frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify browser and server function syntax
        run: |
          node --check lib/secretj/core.js
          node --check api/secretj-auth.js
          node --check api/secretj-data.js
          node --check api/secretj-admin.js
          node --check dist/assets/secretj-account.js
      - name: Install pinned Neon driver
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify production serverless dependency is installed
        run: node -e "const n=require('@neondatabase/serverless'); if(typeof n.neon!=='function') process.exit(1)"
      - name: Test authentication, owner isolation, admin protections and schema
        run: node --test tests/test_secretj_accounts.cjs tests/test_neon_schema_contract.cjs

  postgres:
    name: Execute migration on disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: secretj_ci
          POSTGRES_PASSWORD: ci_only_not_a_real_secret
          POSTGRES_DB: secretj_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secretj_ci -d secretj_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: secretj_ci
      PGPASSWORD: ci_only_not_a_real_secret
      PGDATABASE: secretj_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL command-line client if needed
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Apply migration twice to verify idempotency
        run: |
          psql -v ON_ERROR_STOP=1 -f database/migrations/001_secret_j_multitenant.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/001_secret_j_multitenant.sql
      - name: Verify tables, constraints and private access
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE n int;
          BEGIN
            SELECT COUNT(*) INTO n FROM information_schema.tables
              WHERE table_schema='public' AND table_name LIKE 'sj_%';
            IF n <> 10 THEN
              RAISE EXCEPTION 'Expected 10 private Secret J tables, got %', n;
            END IF;
            IF EXISTS (
              SELECT 1 FROM information_schema.role_table_grants
              WHERE table_schema='public'
                AND table_name LIKE 'sj_%'
                AND grantee='PUBLIC'
            ) THEN
              RAISE EXCEPTION 'A Secret J table is accessible to PUBLIC';
            END IF;
            IF NOT (
              SELECT relrowsecurity FROM pg_class
              WHERE relname='sj_profiles' AND relnamespace='public'::regnamespace
            ) THEN
              RAISE EXCEPTION 'RLS not enabled on profiles';
            END IF;
          END $$;
          SQL
