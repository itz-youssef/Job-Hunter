name: Secret J Isolated Database Connections

# Configuration only. Does not switch DATABASE_URL or enable routing.
# No model calls, schema writes or user data logs.
on:
  push:
    branches: [main]
    paths: [".github/workflows/secretj-isolated-db-connections.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-secretj-site
  cancel-in-progress: false

jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install existing pinned database driver
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify both isolated database connections before installing secrets
        env:
          JOB_HUNTER_DATABASE_URL: ${{ secrets.JOB_HUNTER_DATABASE_URL }}
          BOTFOLIO_DATABASE_URL: ${{ secrets.BOTFOLIO_DATABASE_URL }}
        run: |
          node <<'NODE'
          const {neon}=require('@neondatabase/serverless');
          const targets=[
            ['JOB_HUNTER_DATABASE_URL','ep-soft-cloud-bgoaznc6.c-9.eu-central-1.aws.neon.tech','records'],
            ['BOTFOLIO_DATABASE_URL','ep-super-haze-bgxz5xuw.c-9.eu-central-1.aws.neon.tech','bot_records']
          ];
          (async()=>{
            for(const [key,host,table] of targets){
              try{
                const value=process.env[key];
                const u=new URL(value);
                const pooled=host.replace('.', '-pooler.');
                if(!['postgres:','postgresql:'].includes(u.protocol) || ![host,pooled].includes(u.hostname) || u.pathname!=='/neondb' || !u.username || !u.password)throw Error('Invalid target');
                const sql=neon(value);
                const rows=await sql.query("SELECT current_database() AS db, to_regclass($1) IS NOT NULL AS ready",['secretj_migration_shadow.'+table],{fetchOptions:{signal:AbortSignal.timeout(20000)}});
                if(rows[0]?.db!=='neondb'||rows[0]?.ready!==true)throw Error('Wrong database or missing shadow schema');
                console.log(key+': target and database verified');
              }catch{
                console.error('::error::'+key+': connection or target validation failed (details suppressed)');
                process.exitCode=1;
              }
            }
          })();
          NODE
      - name: Install only the two new Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JOB_HUNTER_DATABASE_URL: ${{ secrets.JOB_HUNTER_DATABASE_URL }}
          BOTFOLIO_DATABASE_URL: ${{ secrets.BOTFOLIO_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$JOB_HUNTER_DATABASE_URL"
          test -n "$BOTFOLIO_DATABASE_URL"
          for key in JOB_HUNTER_DATABASE_URL BOTFOLIO_DATABASE_URL; do
            if ! printf '%s' "${!key}" | npx --yes wrangler@4 secret put "$key" --config cloudflare/site/wrangler.toml >/dev/null 2>&1; then
              echo "::error::$key installation failed (details suppressed)"
              exit 1
            fi
            echo "$key installed on website Worker"
          done
          echo 'Existing DATABASE_URL and production routing were not changed.'

      - name: Synchronize only the two isolated database secrets to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          JOB_HUNTER_DATABASE_URL: ${{ secrets.JOB_HUNTER_DATABASE_URL }}
          BOTFOLIO_DATABASE_URL: ${{ secrets.BOTFOLIO_DATABASE_URL }}
        run: |
          node <<'NODE'
          const project='prj_TBobvLQvaNUHOgdk3GtDGnR8QDyO';
          const team='team_kKgm3sH2SX2V8jGQhu8j8qCs';
          const base='https://api.vercel.com/v10/projects/'+project+'/env';
          const keys=['JOB_HUNTER_DATABASE_URL','BOTFOLIO_DATABASE_URL'];
          const token=process.env.VERCEL_TOKEN;
          async function request(method,params,body){
            const url=new URL(base);
            url.searchParams.set('teamId',team);
            for(const [key,value] of Object.entries(params))url.searchParams.set(key,value);
            const response=await fetch(url,{
              method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
              ...(body?{body:JSON.stringify(body)}:{}),
              signal:AbortSignal.timeout(20000),redirect:'error'
            });
            if(!response.ok)throw Error('Vercel '+method+' HTTP '+response.status);
            return response.json();
          }
          async function metadata(){
            const result=await request('GET',{decrypt:'false'});
            if(!Array.isArray(result.envs))throw Error('Unexpected Vercel metadata response');
            return result.envs;
          }
          (async()=>{
            if(!token||keys.some(key=>!process.env[key]))throw Error('Missing required Actions secret');
            const before=await metadata();
            for(const key of keys){
              if(before.some(v=>v.key===key&&v.target?.includes('production')&&v.target.some(t=>t!=='production')))throw Error('Existing variable has additional deployment targets; refusing to modify it');
            }
            for(const key of keys){
              await request('POST',{upsert:'true'},{key,value:process.env[key],type:'sensitive',target:['production']});
              console.log(key+': Vercel production secret saved');
            }
            const after=await metadata();
            for(const key of keys){
              if(!after.some(v=>v.key===key&&['sensitive','secret'].includes(v.type)&&v.target?.length===1&&v.target[0]==='production'))throw Error('Vercel production secret metadata verification failed');
              console.log(key+': Vercel secret metadata verified');
            }
            console.log('Existing production database and all other variables unchanged; applies to future deployments.');
          })().catch(error=>{
            const safe=String(error?.message||'');
            console.error('::error::Vercel secret synchronization failed (credentials and response bodies suppressed).');
            if(/^Vercel (GET|POST) HTTP [0-9]{3}$/.test(safe))console.error(safe);
            process.exitCode=1;
          });
          NODE
