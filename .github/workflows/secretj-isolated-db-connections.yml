name: Secret J Isolated Database Connections

# Configuration only. Does not switch DATABASE_URL or enable routing.
# No model calls, schema writes or user data logs.
on:
  push:
    branches: [main]
    paths: [".github/workflows/secretj-isolated-db-connections.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-secretj-site
  cancel-in-progress: false

jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install existing pinned database driver
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify both isolated database connections before installing secrets
        env:
          JOB_HUNTER_DATABASE_URL: ${{ secrets.JOB_HUNTER_DATABASE_URL }}
          BOTFOLIO_DATABASE_URL: ${{ secrets.BOTFOLIO_DATABASE_URL }}
        run: |
          node <<'NODE'
          const {neon}=require('@neondatabase/serverless');
          const targets=[
            ['JOB_HUNTER_DATABASE_URL','ep-soft-cloud-bgoaznc6.c-9.eu-central-1.aws.neon.tech','records'],
            ['BOTFOLIO_DATABASE_URL','ep-super-haze-bgxz5xuw.c-9.eu-central-1.aws.neon.tech','bot_records']
          ];
          (async()=>{
            for(const [key,host,table] of targets){
              try{
                const value=process.env[key];
                const u=new URL(value);
                const pooled=host.replace('.', '-pooler.');
                if(!['postgres:','postgresql:'].includes(u.protocol) || ![host,pooled].includes(u.hostname) || u.pathname!=='/neondb' || !u.username || !u.password)throw Error('Invalid target');
                const sql=neon(value);
                const rows=await sql.query("SELECT current_database() AS db, to_regclass($1) IS NOT NULL AS ready",['secretj_migration_shadow.'+table],{fetchOptions:{signal:AbortSignal.timeout(20000)}});
                if(rows[0]?.db!=='neondb'||rows[0]?.ready!==true)throw Error('Wrong database or missing shadow schema');
                console.log(key+': target and database verified');
              }catch{
                console.error('::error::'+key+': connection or target validation failed (details suppressed)');
                process.exitCode=1;
              }
            }
          })();
          NODE
      - name: Install only the two new Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JOB_HUNTER_DATABASE_URL: ${{ secrets.JOB_HUNTER_DATABASE_URL }}
          BOTFOLIO_DATABASE_URL: ${{ secrets.BOTFOLIO_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$JOB_HUNTER_DATABASE_URL"
          test -n "$BOTFOLIO_DATABASE_URL"
          for key in JOB_HUNTER_DATABASE_URL BOTFOLIO_DATABASE_URL; do
            if ! printf '%s' "${!key}" | npx --yes wrangler@4 secret put "$key" --config cloudflare/site/wrangler.toml >/dev/null 2>&1; then
              echo "::error::$key installation failed (details suppressed)"
              exit 1
            fi
            echo "$key installed on website Worker"
          done
          echo 'Existing DATABASE_URL and production routing were not changed.'

      # Vercel keeps its existing Git-based auto-deploy. No API token required.
      # If isolated reads are later enabled there, add the two database URLs
      # directly to the Vercel production environment before redeployment.
