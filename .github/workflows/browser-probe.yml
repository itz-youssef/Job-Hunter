name: Dynamic Careers Browser Probe

on:
  pull_request:
    paths:
      - scripts/probe_browser_careers.py
      - .github/workflows/browser-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Probe public pages with ordinary browser
        run: python -m scripts.probe_browser_careers
