
name: Job Hunter Custom Careers

on:
  workflow_run:
    workflows: ["Job Hunter Monitor"]
    types: [completed]
  workflow_dispatch:
  schedule:
    # Offset from the main monitoring workflow to reduce collisions.
    - cron: "10,25,40,55 * * * *"

permissions:
  contents: write

concurrency:
  group: job-hunter-published-state
  cancel-in-progress: false

jobs:
  scan:
    # External cron avoids duplicate scheduled/chain-triggered scans once enabled.
    # Until then, retain the previous GitHub fallback schedule unchanged.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.CLOUDFLARE_SCHEDULER_ACTIVE != 'true') ||
      (github.event_name == 'workflow_run' && vars.CLOUDFLARE_SCHEDULER_ACTIVE != 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out latest main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install scanner dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify scanner imports and source configuration
        run: |
          python -c "from bs4 import BeautifulSoup; import app.custom_sources, app.egypt_expansion_feeds, app.verified_egypt_employers; print('Scanner imports OK')"
          python -m compileall -q app

      - name: Scan custom career pages (no legacy SMTP)
        env:
          # Preserve vacancy scans but prevent emails to the old operator inbox.
          # Verified account alerts are sent only from the website Resend cron.
          LEGACY_SMTP_DISABLED: "true"
        run: python -m app.custom_monitor

      - name: Save results for Vercel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f dist/data.json
          git add -f dist/custom-status.json
          git add -f data/custom_seen.json

          if ! git diff --cached --quiet; then
            git commit -m "Update custom careers and email status"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
