name: Temporary Siemens Public Request Probe
on:
  pull_request:
    paths:
      - "scripts/temporary_siemens_request_probe.py"
      - ".github/workflows/temporary-siemens-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ordinary browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect public Siemens search request
        run: python -m scripts.temporary_siemens_request_probe
