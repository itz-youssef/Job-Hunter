name: VOIS Ericsson Fawry API probe
on:
  pull_request:
    paths:
      - scripts/probe_three_api.py
      - .github/workflows/probe-three-api.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m scripts.probe_three_api
