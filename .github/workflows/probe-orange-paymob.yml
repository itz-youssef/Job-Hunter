name: Orange Paymob Browser Contract
on:
  pull_request:
    paths:
      - "scripts/probe_orange_paymob.py"
      - ".github/workflows/probe-orange-paymob.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - run: python -m scripts.probe_orange_paymob
