name: PwC Egypt multi-board live reconciliation
on:
  pull_request:
    paths: ['app/pwc_egypt.py','app/custom_sources.py','tests/test_pwc_egypt.py','.github/workflows/pwc-egypt-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_pwc_egypt.py
      - name: Independent source counts and production scan
        run: |
          python -u - <<'PY'
          from app.custom_sources import _json,scan_company
          import json,re
          host="https://pwc.wd3.myworkdayjobs.com"
          for site in ("Global_Experienced_Careers","Global_Campus_Careers"):
              ep=host+"/wday/cxs/pwc/"+site+"/jobs"
              base=_json(ep,{"appliedFacets":{},"limit":20,"offset":0,"searchText":""})
              facets={}
              print("PWC_BASE",site,base.get("total"),[(f.get("facetParameter"),len(f.get("values",[]))) for f in base.get("facets",[])],flush=True)
              print("PWC_LOCATION_TREE",site,json.dumps([f for f in base.get("facets",[]) if "location" in str(f.get("facetParameter")).lower()]),flush=True)
              combined=list(base.get("facets",[]))
              for term in ("Egypt","Cairo","ETIC","Alexandria","Giza"):
                  probe=_json(ep,{"appliedFacets":{},"limit":20,"offset":0,"searchText":term})
                  print("PWC_QUERY",site,term,probe.get("total"),json.dumps(probe.get("facets",[]))[:1500],flush=True)
                  print("PWC_LOCATION_QUERY",site,term,json.dumps([f for f in probe.get("facets",[]) if "location" in str(f.get("facetParameter")).lower()]),flush=True)
                  print("PWC_SAMPLE",site,term,json.dumps(probe.get("jobPostings",[])[:3]),flush=True)
                  combined.extend(probe.get("facets",[]))
              for f in combined:
                  vals=[v for v in f.get("values",[]) if re.search(r"Egypt|Cairo|Giza|Alexandria",str(v.get("descriptor")),re.I)]
                  if vals:facets.setdefault(f["facetParameter"],{}).update({v["id"]:v for v in vals})
              print("PWC_FACETS",site,json.dumps(facets),flush=True)
              for key in ("locationCountry","locations","location"):
                  if key in facets:
                      selected={key:list(facets[key])}
                      break
              else:raise ValueError("No Egypt facet")
              seen=set()
              total=None
              for offset in range(0,4000,20):
                  p=_json(ep,{"appliedFacets":selected,"limit":20,"offset":offset,"searchText":""})
                  if total is None:total=int(p["total"])
                  assert total==int(p["total"])
                  for row in p["jobPostings"]:
                      seen.add(row["externalPath"])
                  if len(seen)>=total:break
                  assert p["jobPostings"]
              print("PWC_OFFICIAL",site,total,len(seen),flush=True)
              assert total==len(seen)
          c=next(x for x in json.load(open("companies.json")) if x["name"]=="PwC Egypt")
          jobs,status,reason=scan_company(c)
          print("PWC_ADAPTER",len(jobs),status,reason,flush=True)
          from collections import Counter
          print("PWC_BOARDS",dict(Counter(j.get("pwc_board") for j in jobs)),flush=True)
          print("PWC_ETIC",sum(j.get("pwc_division")=="ETIC" for j in jobs),flush=True)
          print("PWC_IDS",json.dumps([{"id":j.get("external_id"),"title":j["title"],"location":j["location"],"board":j.get("pwc_board")} for j in jobs]),flush=True)
          assert status=="monitoring" and len(jobs)>4
          assert all(j["company"]=="PwC Egypt" for j in jobs)
          PY
