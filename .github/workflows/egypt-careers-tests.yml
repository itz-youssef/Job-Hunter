name: Egypt Careers Adapters Tests

on:
  pull_request:
    paths:
      - "app/custom_sources.py"
      - "app/egypt_public_feeds.py"
      - "tests/test_egypt_public_feeds.py"
      - "scripts/smoke_new_feeds.py"
      - ".github/workflows/egypt-careers-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Syntax and test suite
        run: |
          python -m compileall -q app
          python -m pytest -q tests/test_egypt_public_feeds.py tests/test_public_feeds.py tests/test_custom_discovery.py tests/test_smart_careers.py
      - name: Live public-source smoke test
        run: python -m scripts.smoke_new_feeds
