name: Probe Egypt expansion sources
on:
  pull_request:
    paths:
      - "scripts/probe_egypt_expansion.py"
      - ".github/workflows/probe-egypt-expansion.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m scripts.probe_egypt_expansion
