name: Five Careers Source Recon
on:
  pull_request:
    paths:
      - "scripts/probe_five_careers.py"
      - ".github/workflows/probe-five-careers.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect read-only public job boards
        run: python -m scripts.probe_five_careers
