name: Weak Career Source Diagnostics
on:
  pull_request:
    paths:
      - "scripts/probe_weak_sources.py"
      - ".github/workflows/weak-career-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m scripts.probe_weak_sources
