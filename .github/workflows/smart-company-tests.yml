name: Smart Company Management Tests

on:
  pull_request:
    paths:
      - "app/custom_sources.py"
      - "app/sources.py"
      - "app/db.py"
      - "app/requested_employers.py"
      - "app/expanded_employers.py"
      - "app/telco_schneider_feeds.py"
      - "app/three_employer_feeds.py"
      - "app/custom_monitor.py"
      - "app/filters.py"
      - "api/companies.js"
      - "api/email-destination.js"
      - "dist/index.html"
      - "tests/test_smart_careers.py"
      - "tests/test_requested_employers.py"
      - "tests/test_expanded_employers.py"
      - "tests/test_telco_schneider_feeds.py tests/test_workday_posted_date.py tests/test_posting_date_backfill.py"
      - "tests/test_three_employer_feeds.py"
      - "tests/test_early_career_matching.py"
      - "tests/test_management_api.cjs"
      - "tests/test_feed_ui.cjs"
      - "tests/test_workspace_features.cjs"
      - ".github/workflows/test-email.yml"
      - "tests/test_workday_posted_date.py"
      - "tests/test_posting_date_backfill.py"
      - ".github/workflows/smart-company-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check syntax
        run: python -m compileall -q app
      - name: Test ATS and matching
        run: python -m pytest -q tests/test_smart_careers.py tests/test_custom_discovery.py tests/test_custom_monitor_integration.py tests/test_early_career_matching.py tests/test_three_employer_feeds.py tests/test_expanded_employers.py tests/test_telco_schneider_feeds.py tests/test_workday_posted_date.py tests/test_posting_date_backfill.py

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test management API and browser scripts
        run: node --test tests/test_management_api.cjs tests/test_feed_ui.cjs tests/test_workspace_features.cjs
