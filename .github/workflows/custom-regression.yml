name: Custom Careers Regression Tests

on:
  pull_request:
    paths:
      - "app/custom_monitor.py"
      - "app/custom_sources.py"
      - "app/filters.py"
      - "tests/test_custom_monitor.py"
      - ".github/workflows/custom-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python syntax
        run: python -m compileall -q app
      - name: Run offline custom-monitoring tests
        run: python -m pytest -q tests/test_custom_monitor.py
