name: Test Email Delivery

on:
  workflow_dispatch:

permissions:
  contents: read

# The old manual SMTP test must not send from the legacy Gmail account.
# Members send verification/test messages via /api/secretj-email (Resend).
jobs:
  legacy-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the unified account-based mail route
        run: |
          echo "Legacy GitHub SMTP email tests are disabled."
          echo "Use Account > Preferences on jobsnow.tech to send a Resend email test."
