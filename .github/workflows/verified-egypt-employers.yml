name: Verified Egypt Employers Release
on:
  pull_request:
    paths:
      - "companies.json"
      - "app/custom_sources.py"
      - "app/verified_egypt_employers.py"
      - "tests/test_verified_egypt_employers.py"
      - ".github/workflows/verified-egypt-employers.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - name: Regression tests
        run: |
          python -m compileall -q app
          python -m pytest -q tests/test_verified_egypt_employers.py tests/test_smart_careers.py tests/test_egypt_expansion_feeds.py
      - name: Live read-only smoke test only for three released companies
        run: |
          python - <<'PY'
          import json
          from app.custom_sources import scan_company
          companies=json.load(open("companies.json"))
          for name in ("Konecta Egypt","ADCB Egypt","Fab Minds Egypt"):
              company=next(c for c in companies if c["name"]==name)
              jobs,status,reason=scan_company(company)
              print(name,status,len(jobs),reason,flush=True)
              assert status in ("monitoring","partial") and len(jobs)>0, (name,status,reason)
              for job in jobs:
                  assert job["title"] and job["url"].startswith("https://")
          PY
