name: Secret J distributed API capacity
on:
  pull_request:
    paths:
      - "benchmarks/distributed-api-capacity.cjs"
      - ".github/workflows/secretj-distributed-api-capacity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: secretj_bench
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: secretj_benchmark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secretj_bench -d secretj_benchmark"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install local test driver
        run: npm install --ignore-scripts --no-audit --no-fund --no-save --package-lock=false pg@8.16.3
      - name: Initialize three disposable databases
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          for db in secretj_job_benchmark secretj_bot_benchmark; do
            docker exec "$PG_CONTAINER" createdb -U secretj_bench "$db"
            docker exec -i "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U secretj_bench -d "$db" < database/isolated/001_secretj_mirror.sql
          done
          for m in 001_secret_j_multitenant 004_optional_expanded_job_preferences 006_career_level_preferences 007_native_preference_monitor 013_botfolio 015_botfolio_account_limits; do
            docker exec -i "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U secretj_bench -d secretj_benchmark < "database/migrations/$m.sql"
          done
          docker exec -i "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U secretj_bench -d secretj_benchmark < benchmarks/isolated-capacity-fixture.sql
          node benchmarks/distributed-api-capacity.cjs fixture
          docker exec -i "$PG_CONTAINER" psql -X -q -v ON_ERROR_STOP=1 -U secretj_bench -d secretj_benchmark < /tmp/secretj-copy-jobs.sql | docker exec -i "$PG_CONTAINER" psql -X -q -v ON_ERROR_STOP=1 -U secretj_bench -d secretj_job_benchmark -c 'COPY secretj_migration_sync.payloads(digest,content) FROM STDIN'
          docker exec -i "$PG_CONTAINER" psql -X -q -v ON_ERROR_STOP=1 -U secretj_bench -d secretj_benchmark < /tmp/secretj-copy-records.sql | docker exec -i "$PG_CONTAINER" psql -X -q -v ON_ERROR_STOP=1 -U secretj_bench -d secretj_job_benchmark -c 'COPY secretj_migration_sync.records(service,owner_id,entity_key,revision,record_digest,record,payload_digest,qualifiers) FROM STDIN'
          docker exec -i "$PG_CONTAINER" psql -X -q -v ON_ERROR_STOP=1 -U secretj_bench -d secretj_benchmark < /tmp/secretj-copy-bots.sql | docker exec -i "$PG_CONTAINER" psql -X -q -v ON_ERROR_STOP=1 -U secretj_bench -d secretj_bot_benchmark -c 'COPY secretj_migration_sync.records(service,owner_id,entity_key,revision,record_digest,record,payload_digest,qualifiers) FROM STDIN'
      - name: Exercise 30000 real handler calls and compare exact results
        run: node benchmarks/distributed-api-capacity.cjs run
