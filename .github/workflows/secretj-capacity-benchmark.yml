name: Secret J isolated capacity benchmark
on:
  pull_request:
    paths: ["benchmarks/isolated-capacity-fixture.sql", ".github/workflows/secretj-capacity-benchmark.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: secretj_bench
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: secretj_benchmark
        options: >-
          --health-cmd "pg_isready -U secretj_bench -d secretj_benchmark"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PG_CONTAINER: ${{ job.services.postgres.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create and verify synthetic fixture
        run: |
          set -euo pipefail
          docker exec -i "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U secretj_bench -d secretj_benchmark < benchmarks/isolated-capacity-fixture.sql
      - name: Benchmark 5000 distinct users at 25 concurrent clients
        run: |
          set -euo pipefail
          for mode in original normalized; do
            if [ "$mode" = original ]; then
              SQL='SELECT o.job_key,o.job_snapshot,o.status,o.discovered_at,o.sent_at FROM bench.original o JOIN bench.users u ON u.id=o.user_id WHERE u.id=md5(\x27synthetic-user-\x27||:uid)::uuid AND u.active ORDER BY o.discovered_at DESC,o.job_key LIMIT 251;'
            else
              SQL='SELECT n.job_key,j.payload||n.qualification AS job_snapshot,n.status,n.discovered_at,n.sent_at FROM bench.normalized n JOIN bench.jobs j ON j.id=n.payload_id JOIN bench.users u ON u.id=n.user_id WHERE u.id=md5(\x27synthetic-user-\x27||:uid)::uuid AND u.active ORDER BY n.discovered_at DESC,n.job_key LIMIT 251;'
            fi
            { printf '%s\n' '\set i :i + 1' '\set uid :client_id * 200 + :i'; printf '%b\n' "$SQL"; } | docker exec -i "$PG_CONTAINER" sh -c 'cat > /tmp/feed.sql'
            docker exec "$PG_CONTAINER" pgbench -n -U secretj_bench -d secretj_benchmark -M prepared -c 25 -j 4 -t 200 -D i=0 -f /tmp/feed.sql -l --log-prefix=/tmp/bench-"$mode"
            docker exec "$PG_CONTAINER" sh -c "cat /tmp/bench-$mode.*" > "$mode.log"
          done
          python3 - <<'PY'
          import statistics, math
          for mode in ('original','normalized'):
              with open(mode+'.log') as f:
                  a=sorted(int(line.split()[2])/1000 for line in f if line.strip())
              assert len(a)==5000, (mode,len(a))
              print(f'{mode}: transactions={len(a)} p50={statistics.median(a):.3f}ms p95={a[math.ceil(len(a)*.95)-1]:.3f}ms p99={a[math.ceil(len(a)*.99)-1]:.3f}ms max={a[-1]:.3f}ms')
          PY
      - name: Benchmark 5000 personalized watch status writes
        run: |
          set -euo pipefail
          for mode in original normalized; do
            { printf '%s\n' '\set i :i + 1' '\set uid :client_id * 200 + :i'; printf "UPDATE bench.%s SET status='pending' WHERE user_id=md5('synthetic-user-'||:uid)::uuid AND status='baseline';\n" "$mode"; } | docker exec -i "$PG_CONTAINER" sh -c 'cat > /tmp/write.sql'
            docker exec "$PG_CONTAINER" pgbench -n -U secretj_bench -d secretj_benchmark -M prepared -c 25 -j 4 -t 200 -D i=0 -f /tmp/write.sql -l --log-prefix=/tmp/write-"$mode"
            docker exec "$PG_CONTAINER" sh -c "cat /tmp/write-$mode.*" > "write-$mode.log"
          done
          python3 - <<'PY'
          import math, statistics
          for mode in ('original','normalized'):
              with open('write-'+mode+'.log') as f:
                  a=sorted(int(line.split()[2])/1000 for line in f if line.strip())
              assert len(a)==5000
              print(f'{mode}: write transactions={len(a)} p50={statistics.median(a):.3f}ms p95={a[math.ceil(len(a)*.95)-1]:.3f}ms p99={a[math.ceil(len(a)*.99)-1]:.3f}ms')
          PY
          docker exec "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U secretj_bench -d secretj_benchmark -c "DO \$\$ BEGIN IF (SELECT count(*) FROM bench.original WHERE status='pending')<>90000 OR (SELECT count(*) FROM bench.normalized WHERE status='pending')<>90000 OR EXISTS(SELECT 1 FROM bench.original o FULL JOIN bench.normalized n USING(user_id,job_key) WHERE o.status IS DISTINCT FROM n.status) THEN RAISE EXCEPTION 'Write parity or user coverage failed'; END IF; END \$\$;"
