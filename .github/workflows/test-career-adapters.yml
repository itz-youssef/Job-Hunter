name: Career Adapter Tests

on:
  pull_request:
    paths:
      - "app/custom_sources.py"
      - "app/oracle_adapter.py"
      - "tests/test_custom_discovery.py"
      - ".github/workflows/test-career-adapters.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Compile scanner modules
        run: python -m compileall -q app
      - name: Run offline adapter regression tests
        run: python -m pytest -q tests/test_custom_discovery.py
