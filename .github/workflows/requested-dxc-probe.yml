name: DXC API Schema Probe
on:
  pull_request:
    paths:
      - scripts/probe_dxc_jsonp.py
      - .github/workflows/requested-dxc-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m scripts.probe_dxc_jsonp
