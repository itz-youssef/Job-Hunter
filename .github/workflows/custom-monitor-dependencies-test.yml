name: Custom Monitor Dependency Smoke Test
on:
  pull_request:
    paths:
      - ".github/workflows/custom-companies.yml"
      - ".github/workflows/custom-monitor-dependencies-test.yml"
      - "requirements.txt"
      - "app/custom_sources.py"
      - "app/egypt_expansion_feeds.py"
      - "app/verified_egypt_employers.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  imports:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Same import and compile smoke checks as production
        run: |
          python -c "from bs4 import BeautifulSoup; import app.custom_sources, app.egypt_expansion_feeds, app.verified_egypt_employers; print('Scanner imports OK')"
          python -m compileall -q app
