name: Egypt Taleo and SAP Live Reconciliation
on:
  pull_request:
    paths:
      - "app/taleo_public.py"
      - "app/weak_employer_adapters.py"
      - ".github/workflows/egypt-taleo-sap-live.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Read official employer portals and compare unique jobs
        run: |
          python - <<'PY'
          import json,re
          from bs4 import BeautifulSoup
          from app.custom_sources import scan_company,_bytes
          from app.taleo_public import public_pages
          registry=json.load(open('companies.json'))
          for c in registry:
              if c["name"] not in ("CIB Egypt","e& / Etisalat","SAP"):continue
              if c["name"]=="SAP":
                  url="https://jobs.sap.com/en/jobs/?country=Egypt&pagesize=20"
                  doc=BeautifulSoup(_bytes(url),"html.parser")
                  print("SAP_OFFICIAL_COUNT",re.findall(r"([\d,]+)\s+jobs found",doc.get_text(" ",strip=True),re.I),flush=True)
                  for a in doc.select('a[href]'):
                      if re.search(r"/en/jobs/\d+/",a['href']):
                          print("SAP_OFFICIAL_LINK",a['href'],a.get_text(" ",strip=True)[:150],flush=True)
              else:
                  kind="cib_egypt" if c["name"]=="CIB Egypt" else "etisalat_egypt"
                  try:
                      rows,totals,complete=public_pages(kind)
                      print("TALEO_OFFICIAL",c["name"],len(rows),sorted(totals),complete,flush=True)
                      print("TALEO_ROWS",json.dumps(rows[:3],ensure_ascii=False),flush=True)
                  except Exception as exc:
                      print("TALEO_ERROR",c["name"],type(exc).__name__,str(exc)[:160],flush=True)
              jobs,status,reason=scan_company(c)
              print("LIVE_ADAPTER",c["name"],len(jobs),status,reason,flush=True)
              print("LIVE_IDS",c["name"],json.dumps([{"id":j.get("external_id"),"title":j.get("title"),"url":j.get("url"),"location":j.get("location"),"coverage":j.get("source_pagination_consistency")} for j in jobs],ensure_ascii=False),flush=True)
          PY
