name: Requested Employer Browser Probe
on:
  pull_request:
    paths:
      - scripts/browser_probe_requested.py
      - .github/workflows/requested-browser-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m scripts.browser_probe_requested
