name: Five Career Adapters Tests
on:
  pull_request:
    paths:
      - "app/employer_feeds.py"
      - "app/custom_sources.py"
      - "tests/test_employer_feeds.py"
      - "scripts/smoke_employers.py"
      - ".github/workflows/five-career-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run offline tests
        run: |
          python -m compileall -q app
          python -m pytest -q tests/test_employer_feeds.py tests/test_smart_careers.py tests/test_custom_discovery.py tests/test_egypt_public_feeds.py
      - name: Live read-only verified employers test
        run: python -m scripts.smoke_employers
