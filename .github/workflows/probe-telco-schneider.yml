name: Schneider Etisalat Source Probe
on:
  pull_request:
    paths:
      - scripts/probe_telco_schneider.py
      - .github/workflows/probe-telco-schneider.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m scripts.probe_telco_schneider
