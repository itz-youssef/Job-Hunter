name: Careers Sources Probe

on:
  pull_request:
    paths:
      - "scripts/probe_public_careers.py"
      - ".github/workflows/careers-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check syntax
        run: python -m py_compile scripts/probe_public_careers.py
      - name: Probe official public careers pages (read-only)
        run: python -m scripts.probe_public_careers
