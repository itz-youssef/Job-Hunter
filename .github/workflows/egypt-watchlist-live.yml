name: Egypt Watchlist Live Acceptance
on:
  pull_request:
    paths:
      - "companies.json"
      - "app/custom_sources.py"
      - "app/egypt_expansion_feeds.py"
      - "scripts/validate_egypt_watchlist.py"
      - "scripts/probe_new_employer_sources.py"
      - "tests/test_new_employer_matching.py"
      - ".github/workflows/egypt-watchlist-live.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile all Python adapters
        run: python -m compileall -q app scripts
      - name: Run employer-specific regression tests
        run: python -m pytest -q tests/test_egypt_expansion_feeds.py tests/test_smart_careers.py tests/test_new_employer_matching.py tests/test_egypt_extra_feeds.py
      - name: Verify actual public vacancy extraction for the entire watchlist
        run: python -m scripts.validate_egypt_watchlist
      - name: Upload per-company diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: egypt-watchlist-live-results
          path: watchlist-live-results.json
          if-no-files-found: ignore

      - name: Diagnose employer ATS integrations (read only)
        if: always()
        run: python -m scripts.probe_new_employer_sources
      - name: Upload ATS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: egypt-new-employer-ats-diagnostics
          path: new-employer-source-diagnostics.json
          if-no-files-found: ignore
