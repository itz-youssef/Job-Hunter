name: Job Hunter Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "3,18,33,48 * * * *"

permissions:
  contents: read

concurrency:
  group: job-hunter-published-state
  cancel-in-progress: false

jobs:
  monitor:
    # Keep GitHub cron as fallback until Cloudflare cron is deployed and verified.
    # Manually dispatched runs are never disabled by this variable.
    if: github.event_name != 'schedule' || vars.CLOUDFLARE_SCHEDULER_ACTIVE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write
      pages: read

    env:
      DB_PATH: data/jobs.db
      MONITOR_COMPANIES: Valeo,Microsoft,Siemens

    steps:
      - name: Download project
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore job history
        run: |
          mkdir -p data state

          if [ -f state/initialized ] && [ ! -f state/history.sqlite ]; then
            echo "::error::Saved history is missing."
            exit 1
          fi

          if [ -f state/history.sqlite ]; then
            cp state/history.sqlite data/jobs.db
            python - <<'PY'
          import sqlite3

          with sqlite3.connect("data/jobs.db") as connection:
              result = connection.execute("PRAGMA integrity_check").fetchone()[0]
              if result != "ok":
                  raise RuntimeError("Saved database failed integrity check")
          PY
          fi

      - name: Check careers websites
        id: scan
        run: python -m app.run_once

      - name: Save job history
        if: always() && steps.scan.outcome != 'skipped'
        run: |
          if [ ! -f data/jobs.db ]; then
            echo "::error::No database was created."
            exit 1
          fi

          python - <<'PY'
          import sqlite3
          from pathlib import Path

          source = sqlite3.connect("data/jobs.db")
          destination = sqlite3.connect("state/history.sqlite")
          try:
              source.backup(destination)
              result = destination.execute("PRAGMA integrity_check").fetchone()[0]
              if result != "ok":
                  raise RuntimeError("Database backup failed integrity check")
          finally:
              destination.close()
              source.close()

          Path("state/initialized").write_text("Job history initialized\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/history.sqlite state/initialized

          if ! git diff --cached --quiet; then
            git commit -m "Update job monitoring history"
            git push origin HEAD:main
          fi

      - name: Send new job alerts
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python -m app.notify_once

      - name: Export website data
        run: python -m app.export_site

      
      - name: Publish snapshot for Vercel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public job snapshot"
            git push origin HEAD:main
          fi

        
      - name: Prepare public website
        run: |
          mkdir -p public-site
          cp dist/index.html public-site/index.html
          cp -R dist/assets public-site/assets
          cp dist/data.json public-site/data.json
          touch public-site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-site
          retention-days: 1

  deploy:
    needs: monitor
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
