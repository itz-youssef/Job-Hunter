name: Adaptive Dictionary Research (Shadow)

on:
  schedule:
    # Native timezone scheduling follows Cairo DST; one daily trigger.
    - cron: '15 10 * * *'
      timezone: 'Africa/Cairo'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Benchmark both free models or run daily research'
        type: choice
        options:
          - benchmark
          - daily
        default: benchmark

permissions:
  contents: write

concurrency:
  group: secretj-adaptive-research-shadow
  cancel-in-progress: false

jobs:
  research:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test isolated research contracts
        run: node --test tests/test_adaptive_research.cjs
      - name: Load isolated shadow state
        id: state
        run: |
          git fetch origin refs/heads/research/shadow-state:refs/remotes/origin/research/shadow-state
          git worktree add --detach "$RUNNER_TEMP/shadow-state" origin/research/shadow-state
          mkdir -p "$RUNNER_TEMP/shadow-state/research-results"
      - name: Run free-model research
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEARCH_CF_API_TOKEN: ${{ secrets.RESEARCH_CF_API_TOKEN }}
          RESEARCH_CF_ACCOUNT_ID: ${{ secrets.RESEARCH_CF_ACCOUNT_ID }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          RESEARCH_MODE: ${{ inputs.mode || 'daily' }}
          RESEARCH_STATE_DIR: ${{ runner.temp }}/shadow-state/research-results
        run: node research/research-agent.cjs
      - name: Preserve budget ledger and shadow results (never main)
        if: always() && steps.state.outcome == 'success'
        working-directory: ${{ runner.temp }}/shadow-state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -z "$(find research-results -maxdepth 1 -type f -name '*.json' -print -quit)" ]; then exit 0; fi
          git add -- research-results/*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update isolated research candidates and evaluation'
            git push origin HEAD:refs/heads/research/shadow-state
          fi
      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-dictionary-shadow-report
          path: ${{ runner.temp }}/shadow-state/research-results/report.json
          if-no-files-found: ignore
          retention-days: 14
