name: VOIS Ericsson Fawry source probe
on:
  pull_request:
    paths:
      - scripts/probe_three_employers.py
      - .github/workflows/probe-three-employers.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m scripts.probe_three_employers
