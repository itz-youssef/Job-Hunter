<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 920" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<defs>
 <linearGradient id="wall" x1="0" y1=".4" x2="1" y2=".7"><stop stop-color="#acacac"/><stop offset=".21" stop-color="#f2f2f2"/><stop offset=".72" stop-color="#f2f2f2"/><stop offset="1" stop-color="#acacac"/></linearGradient>
 <linearGradient id="floor" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#f2f2f2"/><stop offset=".45" stop-color="#e1e1e1"/><stop offset="1" stop-color="#acacac"/></linearGradient>
 <linearGradient id="beam" x1="0" x2="1" y1="0" y2=".9"><stop stop-color="#bdbdbd"/><stop offset=".65" stop-color="#acacac"/><stop offset="1" stop-color="#555555"/></linearGradient>
 <linearGradient id="right" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#bdbdbd"/><stop offset=".45" stop-color="#acacac"/><stop offset="1" stop-color="#555555"/></linearGradient>
 <linearGradient id="veil" x1="0" x2="1"><stop stop-color="#f4f4f4" stop-opacity=".14"/><stop offset=".34" stop-color="#fff" stop-opacity=".48"/><stop offset=".65" stop-color="#fff" stop-opacity=".40"/><stop offset="1" stop-color="#f4f4f4" stop-opacity=".13"/></linearGradient>
 <filter id="concrete" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".18" numOctaves="2" seed="13" stitchTiles="stitch" result="noise"/><feColorMatrix in="noise" type="saturate" values="0" result="gray"/><feComponentTransfer in="gray"><feFuncA type="linear" slope=".10"/></feComponentTransfer></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
