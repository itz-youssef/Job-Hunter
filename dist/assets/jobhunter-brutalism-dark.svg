 <linearGradient id="floor" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#202020"/><stop offset=".45" stop-color="#161616"/><stop offset="1" stop-color="#1c1c1c"/></linearGradient>
 <linearGradient id="beam" x1="0" x2="1" y1="0" y2=".9"><stop stop-color="#303030"/><stop offset=".65" stop-color="#1c1c1c"/><stop offset="1" stop-color="#070707"/></linearGradient>
